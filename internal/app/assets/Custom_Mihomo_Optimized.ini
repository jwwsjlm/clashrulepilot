; ClashRulePilot - 简洁版 Mihomo 远程 ACL 订阅转换配置
; 用途：Sublink Pro / Subconverter 外部配置，输出标准 Clash.Meta/Mihomo YAML
; 原则：个人 ACL 优先、国内直连、国外默认香港、AI 默认美国、YouTube/国际媒体默认香港
; 规则参考：Aethersailor/Custom_OpenClash_Rules @ main
; 参考版本（2026-08-14）：24750793b296169ad9c96620ece011e6e17a569d
; 当前版本更新时间：2026-09-10（Asia/Shanghai）
; 节点订阅由转换请求单独传入；本文件不包含节点订阅 URL、Token 或 OpenClash 覆写

[custom]

; 过滤机场说明类节点；保持为 Sublink Pro/RE2 可识别的普通正则
exclude_remarks=(到期|剩余|流量|套餐|官网|客服|公告|重置|订阅|群组)

; 1. 个人 ACL：由 personal_rules.json 按全局精确度排序后内联，避免直连/代理父子规则互相吞掉
; 同步生成的标准纯文本 ACL（供其他客户端使用）：
; {{PUBLIC_RAW_BASE}}/rules/acl/Custom_Direct.list
; {{PUBLIC_RAW_BASE}}/rules/acl/Custom_Proxy.list
{{PERSONAL_ACL_RULESETS}}

; 2. AI 例外：必须位于 Microsoft、国内域名和兜底规则之前
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,copilot.microsoft.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,api.microsoftapp.net
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,copilot.azure.com
ruleset=🤖 AI 服务,[]DOMAIN-SUFFIX,openai.azure.com
ruleset=🤖 AI 服务,[]DOMAIN,edgeservices.bing.com
ruleset=🤖 AI 服务,[]DOMAIN,sydney.bing.com
ruleset=🤖 AI 服务,[]DOMAIN,img.bing.com

; 3. 私网与 Aethersailor 自定义直连/代理规则
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_IP.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_Port.yaml,28800
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_IP.yaml,28800

; 4. 国内服务、游戏下载、BT/PT 默认直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,microsoft@cn
ruleset=🎯 全球直连,[]GEOSITE,apple-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Domain.yaml,28800
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_IP.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker
ruleset=🎯 全球直连,[]GEOSITE,category-pt
ruleset=🎯 全球直连,[]GEOSITE,xunlei

; 5. AI：ChatGPT、Copilot、Gemini、Claude 等统一走美国优先组
ruleset=🤖 AI 服务,[]GEOSITE,openai
ruleset=🤖 AI 服务,[]GEOSITE,category-ai-!cn

; 6. YouTube 单独保留，默认香港；其他国际媒体合并为一个组
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎬 国际媒体,[]GEOSITE,tiktok
ruleset=🎬 国际媒体,[]GEOSITE,netflix
ruleset=🎬 国际媒体,[]GEOSITE,disney
ruleset=🎬 国际媒体,[]GEOSITE,hbo
ruleset=🎬 国际媒体,[]GEOSITE,primevideo
