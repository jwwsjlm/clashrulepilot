ruleset=🎬 国际媒体,[]GEOSITE,bahamut
ruleset=🎬 国际媒体,[]GEOSITE,category-entertainment
ruleset=🎬 国际媒体,[]GEOIP,netflix,no-resolve

; 7. 其余常用国外服务合并，默认香港，避免策略组过多
ruleset=🌐 国外服务,[]DOMAIN-SUFFIX,googleapis.cn
ruleset=🌐 国外服务,[]DOMAIN-SUFFIX,xn--ngstr-lra8j.com
ruleset=🌐 国外服务,[]GEOSITE,category-communication
ruleset=🌐 国外服务,[]GEOSITE,category-social-media-!cn
ruleset=🌐 国外服务,[]GEOSITE,github
ruleset=🌐 国外服务,[]GEOSITE,docker
ruleset=🌐 国外服务,[]GEOSITE,category-scholar-!cn
ruleset=🌐 国外服务,[]GEOSITE,googlefcm
ruleset=🌐 国外服务,[]GEOSITE,google
ruleset=🌐 国外服务,[]GEOSITE,microsoft
ruleset=🌐 国外服务,[]GEOSITE,apple
ruleset=🌐 国外服务,[]GEOSITE,category-ecommerce
ruleset=🌐 国外服务,[]GEOSITE,paypal
ruleset=🌐 国外服务,[]GEOSITE,category-cryptocurrency
ruleset=🌐 国外服务,[]GEOIP,telegram,no-resolve
ruleset=🌐 国外服务,[]GEOIP,twitter,no-resolve
ruleset=🌐 国外服务,[]GEOIP,facebook,no-resolve
