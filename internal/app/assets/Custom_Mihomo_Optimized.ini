; 8. 国外游戏可手动切换，默认直连；测速默认直连
ruleset=🎮 游戏平台,[]GEOSITE,steam
ruleset=🎮 游戏平台,[]GEOSITE,category-games-!cn
ruleset=🎯 全球直连,[]GEOSITE,category-speedtest

; 9. GFW、国外域名、中国大陆和最终兜底
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🌐 国外服务,[]GEOSITE,geolocation-!cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
ruleset=🐟 漏网之鱼,[]FINAL

; 业务组只引用节点组；每行第一个选项就是转换后的默认选择
custom_proxy_group=🚀 手动选择`select`[]⚡ URLTest`[]🌐 全部节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇰🇷 韩国节点
custom_proxy_group=🤖 AI 服务`select`[]🇺🇸 美国节点`[]⚡ URLTest`[]🚀 手动选择`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点
custom_proxy_group=📹 YouTube`select`[]🇭🇰 香港节点`[]⚡ URLTest`[]🚀 手动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点
custom_proxy_group=🎬 国际媒体`select`[]🇭🇰 香港节点`[]⚡ URLTest`[]🚀 手动选择`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点
custom_proxy_group=🌐 国外服务`select`[]🇭🇰 香港节点`[]⚡ URLTest`[]🚀 手动选择`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🎯 全球直连
custom_proxy_group=🎮 游戏平台`select`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🚀 手动选择
custom_proxy_group=🐟 漏网之鱼`select`[]🌐 国外服务`[]🚀 手动选择`[]⚡ URLTest`[]🎯 全球直连

; ⚡ URLTest 对全部节点做延迟测试；♻️ 自动选择保留为兼容旧配置的别名
; 叶子节点组：参考 Aethersailor 的命名规则，保留常用六地区即可
; REJECT 仅用于订阅完全没有对应地区节点时保证配置仍可生成
custom_proxy_group=♻️ 自动选择`select`[]⚡ URLTest
custom_proxy_group=⚡ URLTest`url-test`.*`https://cp.cloudflare.com/generate_204`600,,50
custom_proxy_group=🌐 全部节点`select`.*
custom_proxy_group=🇭🇰 香港节点`url-test`(🇭🇰|香港|港|Hong[ _-]?Kong|Hongkong|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(🇺🇸|美国|美國|United[ _-]?States|USA|America|洛杉矶|圣何塞|西雅图|纽约|芝加哥|达拉斯|迈阿密|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(🇯🇵|日本|东京|東京|大阪|埼玉|Japan|JPN|NRT|HND|KIX|TYO|OSA|关西|Kansai|\bJP(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(🇸🇬|新加坡|狮城|獅城|Singapore|SIN|\bSG(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾节点`url-test`(🇹🇼|台湾|台灣|台北|新北|彰化|Taiwan|TWN|TPE|ROC|\bTW(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(🇰🇷|韩国|韓國|首尔|首爾|春川|Korea|KOR|ICN|\bKR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b)`[]REJECT`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
